[build]
builder = "dockerfile"

[deploy]
# alembic upgrade head corre desde la raíz del repo — donde vive alembic.ini
preDeployCommand = "alembic -c /app/alembic.ini upgrade head"
startCommand = "python run.py --prod"
healthcheckPath = "/health"
# EasyOCR descarga modelos (~300MB) en el primer arranque — necesita tiempo extra
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
