[pytest]
testpaths = tests
# Muestra print() en tests que pasan (útil para debugging)
addopts = -v
filterwarnings =
    # Google Gemini SDK usa _UnionGenericAlias, deprecado en Python 3.14
    ignore::DeprecationWarning:google
    # slowapi usa asyncio.iscoroutinefunction, deprecado en Python 3.16
    ignore::DeprecationWarning:slowapi
    # EasyOCR usa torch.ao.quantization, deprecado en torch 2.10
    ignore::DeprecationWarning:easyocr
    ignore::DeprecationWarning:torch
    # fakeredis: ResourceWarning inofensivo, el proceso lo limpia al salir
    ignore::ResourceWarning:redis
