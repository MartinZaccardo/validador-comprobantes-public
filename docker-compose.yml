services:
  db:
    image: postgres:16-alpine
    container_name: validador_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: validador
      POSTGRES_USER: validador
      POSTGRES_PASSWORD: validador_dev
    ports:
      - "5433:5432" # 5432 ocupado por PostgreSQL nativo de Windows
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
